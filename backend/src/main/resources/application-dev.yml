spring:
  application:
    name: crudguga-backend

  datasource:
    url: jdbc:h2:file:./data/crudguga;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  frontend:
    origin: http://192.168.100.44:5174
